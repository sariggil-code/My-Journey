<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0908">
<title>Gallery — Where I Have Been</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
</head>
<body>
<main class="wrap">
  <div class="page-head">
    <div class="mono">· One frame per stop ·</div>
    <h1><span class="grad">Gallery</span></h1>
    <p>A photo from each country. Tap one to see it full size.</p>
  </div>
  <div class="chips" id="legend" style="margin-bottom:26px"></div>
  <div class="masonry" id="grid"></div>
</main>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="x" aria-label="Close">✕</button><button class="p" aria-label="Previous photo">‹</button><button class="n" aria-label="Next photo">›</button>
  <img id="lb-img" alt=""><div class="cap" id="lb-cap"></div>
</div>
<script>
(function () {
  var ALL = TRAVEL.countries.filter(function (c) { return c.photo; }), filter = null, cur = [], idx = 0;
  var grid = document.getElementById('grid'), legend = document.getElementById('legend'), lb = document.getElementById('lb');
  function draw() {
    legend.innerHTML = '<button class="chip' + (filter ? '' : ' on') + '" data-k="">All <b>' + ALL.length + '</b></button>' + CONT_ORDER.map(function (k) {
      var n = ALL.filter(function (c) { return c.cont === k; }).length;
      return '<button class="chip' + (filter === k ? ' on' : '') + '" data-k="' + k + '" style="--c:var(' + CONT[k].v + ')"><i></i>' + CONT[k].name + ' <b>' + n + '</b></button>';
    }).join('');
    cur = ALL.filter(function (c) { return !filter || c.cont === filter; }).sort(function (a, b) { return (a.years[0] || 0) - (b.years[0] || 0); });
    grid.innerHTML = cur.map(function (c, i) {
      return '<figure class="shot" data-i="' + i + '" tabindex="0" role="button" aria-label="Open photo from ' + esc(c.en) + '"><img decoding="async" width="' + c.photo.w + '" height="' + c.photo.h + '" src="assets/thumbs/' + c.photo.f + '" alt="Photo from ' + esc(c.en) + '">' +
        '<figcaption>' + flag(c) + esc(c.en) + '</figcaption></figure>';
    }).join('');
  }
  function open(i) {
    idx = (i + cur.length) % cur.length; var c = cur[idx];
    document.getElementById('lb-img').src = 'assets/photos/' + c.photo.f;
    document.getElementById('lb-img').alt = 'Photo from ' + c.en;
    document.getElementById('lb-cap').innerHTML = flag(c) + esc(c.en) + ' <span>' + yearsText(c) + '</span>';
    lb.classList.add('open');
  }
  function close() { lb.classList.remove('open'); }
  legend.addEventListener('click', function (e) { var b = e.target.closest('.chip'); if (!b) return; filter = b.dataset.k || null; draw(); });
  grid.addEventListener('click', function (e) { var f = e.target.closest('.shot'); if (f) open(+f.dataset.i); });
  grid.addEventListener('keydown', function (e) { var f = e.target.closest('.shot'); if (f && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); open(+f.dataset.i); } });
  lb.querySelector('.x').onclick = close;
  lb.querySelector('.p').onclick = function () { open(idx - 1); };
  lb.querySelector('.n').onclick = function () { open(idx + 1); };
  lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') open(idx - 1); else if (e.key === 'ArrowRight') open(idx + 1);
  });
  draw();
})();
</script>
</body>
</html>
